<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Events</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('index') }}">Community Events</a><nav>{% if session.get('admin') %}<a href="{{ url_for('new_event') }}">Create event</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="quiet">Sign out</button></form>{% else %}<a href="{{ url_for('login') }}">Admin sign in</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>Find something to look forward to.</footer></body></html>
