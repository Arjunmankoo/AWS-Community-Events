# Put this file in /etc/nginx/conf.d/events.conf (inside the http context).
# Replace domain and certificate paths before enabling. Validate with nginx -t.
limit_req_zone $binary_remote_addr zone=events_login:10m rate=5r/m;
server {
    listen 80;
    server_name events.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name events.example.com;
    ssl_certificate /etc/letsencrypt/live/events.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.com/privkey.pem;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /login {
        limit_req zone=events_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
