{% extends 'base.html' %}{% block content %}<section class="form-panel"><h1>Create an event</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="title">Event title</label><input id="title" name="title" maxlength="120" required value="{{ request.form.get('title','') }}"><label for="description">Description</label><textarea id="description" name="description" maxlength="4000" required rows="5">{{ request.form.get('description','') }}</textarea><label for="location">Location</label><input id="location" name="location" maxlength="160" required value="{{ request.form.get('location','') }}"><label for="starts_at">Date and time (Europe/London local time)</label><input id="starts_at" name="starts_at" type="datetime-local" required value="{{ request.form.get('starts_at','') }}"><label for="image">Image (optional, JPEG, PNG or WebP, up to 5 MB)</label><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp"><button>Publish event</button></form></section>{% endblock %}
